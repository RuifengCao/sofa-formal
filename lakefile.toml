name = "sofa-formal"
defaultTargets = ["Sofa", "SofaSubmission"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Sofa"

# The upstream statements (`Challenge`, with `sorry`) and their proofs (`Solution`), for
# `comparator`; see `UPSTREAM.md`.
[[lean_lib]]
name = "SofaSubmission"
globs = ["SofaSubmission.+"]
